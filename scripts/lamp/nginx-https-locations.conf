# Install as a snippet in the existing bocail.com TLS server.
root /var/www/lianxin-lamp/current;
index index.html;

location = /lamp-api/oauth/anyTenant/login {
    proxy_pass http://127.0.0.1:28760/anyTenant/login;
}
location = /lamp-api/oauth/anyTenant/captcha {
    proxy_pass http://127.0.0.1:28760/anyTenant/captcha;
}
location = /lamp-api/oauth/anyUser/logout {
    proxy_pass http://127.0.0.1:28760/anyUser/logout;
}
location = /lamp-api/oauth/anyUser/dict/findDictItemByType {
    proxy_pass http://127.0.0.1:28760/anyUser/dict/findDictItemByType;
}
location = /lamp-api/oauth/anyone/getUserInfoById {
    set $args "";
    proxy_pass http://127.0.0.1:28760/anyone/getUserInfoById;
}
# Keep demo registration, token introspection and management endpoints on loopback.
location ~ "^/lamp-api/.*;" {
    return 404;
}
location ~* ^/lamp-api/(?:[^/]+/)?(?:actuator|druid|v3|v2|swagger-ui|swagger-resources|doc\.html|anyTenant|anyUser|anyone/getUserInfoById)(?:/|$) {
    return 404;
}
location /lamp-api/ {
    rewrite ^/lamp-api(/gateway/.*)$ $1 break;
    rewrite ^/lamp-api/(?:oauth|base|system|generator|activiti)/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:28760;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location ~ ^/(?:api/|portal/|sms$|health$) {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location = /_app.config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
}
location / {
    try_files $uri $uri/ /index.html;
}
