# Private Lamp Cloud standalone origin. Publish through the HTTPS reverse proxy.
server.address=127.0.0.1
server.port=28760
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
spring.datasource.druid.url=jdbc:mysql://127.0.0.1:3306/lamp_none?serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.druid.username=lianxin_lamp
spring.datasource.druid.password=${LAMP_DB_PASSWORD}
spring.datasource.druid.initial-size=1
spring.datasource.druid.min-idle=1
spring.datasource.druid.max-active=12
spring.datasource.druid.stat-view-servlet.enabled=false
lamp.database.p6spy=false
lamp.redis.ip=127.0.0.1
lamp.redis.port=6379
lamp.redis.password=
lamp.redis.database=7
lamp.scan.enabled=false
lamp.log.ipv4.enabled=false
lamp.log.ipv6.enabled=false
lamp.system.notAllowWrite=false
lamp.system.verifyPassword=true
lamp.system.verifyCaptcha=true
lamp.system.defPwd=${LAMP_DEFAULT_PASSWORD}
lamp.system.recordLampArgs=false
lamp.system.recordLampResult=false
lamp.ignore.authEnabled=true
lamp.ignore.notConfigUriAllow=false
lamp.rabbitmq.enabled=false
lamp.file.local.storage-path=/var/lib/lianxin-lamp/files
lamp.file.local.url-prefix=https://bocail.com/lamp-files/
logging.file.path=/var/lib/lianxin-lamp/log
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.shutdown.access=none
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
knife4j.enable=false
sa-token.timeout=28800
sa-token.active-timeout=3600
